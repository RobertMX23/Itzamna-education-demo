version: "2.0"
title: "Population indicators dashboard"
purpose: "Comparar poblacion total, hombres y mujeres por entidad y periodo sin inferir causalidad."
audience:
  - data analyst
  - planeacion
  - lector de portafolio
filters:
  - id: indicator
    label: Indicador
    required: true
    allowed: [POP-TOTAL, POP-MALE, POP-FEMALE]
  - id: entity
    label: Entidad
    required: false
    behavior: "Una entidad o todas las entidades disponibles."
  - id: period
    label: Periodo
    required: true
    behavior: "Solo periodos presentes en el indicador seleccionado."
  - id: sort
    label: Orden
    required: true
    allowed: [desc, asc]
    behavior: "Ordenar el ranking territorial de mayor a menor o de menor a mayor."
  - id: chart_mode
    label: Visualizacion
    required: true
    allowed: [trend, composition]
    behavior: "Alternar serie historica por sexo y composicion del periodo seleccionado."
analysis_modes:
  individual:
    label: "Entidad seleccionada"
    dimensions: [indicator_id, geo_area, time_period]
    metrics: [value, unit, sex, source, status]
  comparative:
    label: "Comparacion territorial"
    dimensions: [indicator_id, time_period, geo_area]
    metrics: [value, rank, territorial_gap, sort_direction]
metrics:
  - id: selected_population
    label: Poblacion seleccionada
    source: "sum(value) por indicador, entidad y periodo"
    rule: "Para todas las entidades, sumar; no promediar poblacion."
  - id: female_share
    label: Participacion femenina
    source: "female / total * 100"
    rule: "Mostrar N/D si el total es cero o no existe la categoria femenina."
  - id: gender_gap
    label: Brecha mujeres-hombres
    source: "female - male"
    rule: "La brecha es absoluta y conserva el signo; no representa desigualdad causal."
  - id: data_coverage
    label: Cobertura
    source: "count(distinct geo_area)"
visualizations:
  - id: time_series
    type: multi_line
    title: Serie historica
    x: time_period
    y: value
    series: [total, male, female]
    rule: "Comparar los cinco periodos estatales comunes; no interpretar la linea como causalidad."
  - id: sex_composition
    type: horizontal_bar
    title: Composicion por sexo
    x: value
    y: sex
    rule: "Mostrar hombres y mujeres para el periodo seleccionado, conservando unidad personas."
  - id: entity_ranking
    type: horizontal_bar
    title: Ranking territorial
    x: value
    y: geo_name
    rule: "Respetar sort; indicar periodo seleccionado y unidad."
  - id: growth_heatmap
    type: heatmap
    title: Consistencia de crecimiento
    rows: geo_name
    columns: time_period
    value: value
    rule: "Solo habilitar cuando existan varios periodos; usar color como apoyo."
  - id: observation_table
    type: table
    title: Detalle de observaciones
    columns: [geo_name, sex, time_period, value, unit, status, source]
    rule: "La tabla es la alternativa accesible a las visualizaciones."
  - id: relationship_note
    type: annotation
    title: Lectura metodologica
    rule: "Toda relacion entre indicadores se presenta como descriptiva, no causal."
states:
  empty: "No hay observaciones para los filtros seleccionados."
  incomplete: "La cobertura disponible no permite una comparacion completa."
  official: "Datos oficiales de INEGI; serie estatal comparable 1995, 2000, 2005, 2010 y 2020."
accessibility:
  - "Cada control tiene label visible y aria-label cuando sea necesario."
  - "El color no es el unico canal para comunicar estados."
  - "Los graficos incluyen titulo, periodo y unidad."
  - "La fuente y la fecha de extraccion se conservan en el dataset."
  - "La tabla de observaciones permite leer los valores sin depender del color."
responsive:
  desktop: "Tres metricas en fila; visualizaciones en dos columnas."
  mobile: "Una columna; filtros y visualizaciones apilados."
