<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Laboratorio experimental de Apache ECharts para comparar dos entidades.">
    <title>ECharts lab | Itzamna</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="charts/echarts/echarts-lab.css">
  </head>
  <body>
    <main class="shell echarts-lab">
      <header class="page-header">
        <p class="eyebrow">ITZAMNA / ECHARTS LAB</p>
        <h1>Comparacion experimental</h1>
        <p class="lede">Prueba aislada para comparar poblacion por entidad y sexo.</p>
        <p class="notice">Rama experimental. El dashboard SVG estable no se modifica.</p>
      </header>

      <section class="echarts-toolbar" aria-label="Filtros del prototipo ECharts">
        <label for="echarts-first-entity">Entidad principal
          <select id="echarts-first-entity" aria-label="Seleccionar entidad principal"></select>
        </label>
        <label for="echarts-second-entity">Entidad comparativa
          <select id="echarts-second-entity" aria-label="Seleccionar entidad comparativa"></select>
        </label>
      </section>

      <section class="panel echarts-panel" aria-label="Comparacion ECharts">
        <div class="panel-heading"><h2>Serie comparativa</h2><span id="echarts-status" role="status" aria-live="polite">Cargando...</span></div>
        <div id="echarts-comparison" class="echarts-container" role="img" aria-label="Comparacion historica de dos entidades"></div>
      </section>
    </main>
    <script type="module" src="charts/echarts/echarts-lab.js"></script>
  </body>
</html>
