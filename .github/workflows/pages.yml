name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_pages:
        description: "Publicar esta rama en GitHub Pages"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Python contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run dashboard smoke test
        run: python tests/smoke_dashboard.py
      - name: Check dashboard JavaScript
        run: node --check dashboard/app.js
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install browser test dependencies
        run: npm install
      - name: Install Chromium for ECharts acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Run ECharts acceptance tests
        run: npm run test:e2e:echarts

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' || inputs.publish_pages == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
